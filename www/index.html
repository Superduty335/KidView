<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KidView</title>
<meta name="description" content="Videos, songs and coloring pages chosen by parents.">
<meta name="theme-color" content="#ffc93c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KidView">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app"></main>
<button id="lockbadge" class="lockbadge" hidden aria-label="Press and hold to unlock"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="22" width="28" height="20" rx="5" fill="currentColor"/><path d="M16 22 V16 a8 8 0 0 1 16 0 V22" fill="none" stroke="currentColor" stroke-width="5"/></svg><span class="hold-ring"></span></button>
<button id="nowplaying" class="nowplaying" hidden><span class="np-note">♪</span><span class="np-title"></span><span class="np-hint">Tap to pause</span></button>
<button id="refocus" class="refocus" hidden>Tap to keep playing</button>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
